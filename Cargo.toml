[package]
name = "netherite"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "NetheriteParser: a mihomo-verified subscription builder"
license = "MIT"

[lib]
name = "netherite"
path = "src/lib.rs"

[[bin]]
name = "netherite"
path = "src/main.rs"

[dependencies]
netherite-core = { git = "https://github.com/GooseDev72/netherite-core.git" }
v2keylib = { git = "https://github.com/GooseDev72/v2keylib.git" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1